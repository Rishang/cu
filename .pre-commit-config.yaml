repos:
- repo: local
  hooks:
    # cu is Go now (see AGENTS.md); this mirrors `task lint`.
    - id: go-lint
      name: go-lint
      entry: task lint
      language: system
      files: \.go$
      pass_filenames: false

- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
    - id: gitleaks