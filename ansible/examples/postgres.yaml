# Complete, runnable role schema. Values are supplied by
# cloudutil_postgres_environment in playbook.yml.
provider:
  name: postgres
  version: "16"
  host: ${POSTGRES_HOST}
  port: 5432
  username: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  # RDS enforces TLS. verify-full validates the server certificate against
  # the AWS RDS CA bundle; download it from
  # https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem and
  # point cert at the bundle for your region.
  ssl_mode: verify-full
  cert: /etc/ssl/certs/rds-global-bundle.pem

database:
  - name: example_app
    create: true
    extensions:
      - name: pgcrypto

users:
  - name: example_reader
    password: ${EXAMPLE_READER_PASSWORD}
    privileges:
      # Grants SELECT on existing tables and defaults for tables created later.
      - db: example_app
        db_schema: public
        readonly: true
        tables: [ALL]

  - name: example_writer
    password: ${EXAMPLE_WRITER_PASSWORD}
    privileges:
      # Grants CRUD on existing tables and defaults for tables created later.
      - db: example_app
        db_schema: public
        readwrite: true
        tables: [ALL]

  # A login role may intentionally have no database privileges.
  - name: example_automation
    password: ${EXAMPLE_AUTOMATION_PASSWORD}

custom_sql:
  - name: create_example_records
    database: example_app
    # Paths are relative to the ansible/ directory from which this playbook runs.
    loader_path: ./examples/sql
    query: "{% include 'create_example_records.sql.j2' %}"
    template_context:
      schema: public
      table: example_records

  - name: seed_example_records
    database: example_app
    query: |
      INSERT INTO public.example_records (id, value)
      VALUES (%s, %s)
      ON CONFLICT (id) DO UPDATE SET value = EXCLUDED.value;
    params: [1, provisioned-by-cloudutil]

  - name: document_example_records
    database: example_app
    inject_env: false
    query: |
      COMMENT ON TABLE public.example_records IS
      'Provisioned by the CloudUtil PostgreSQL role';
