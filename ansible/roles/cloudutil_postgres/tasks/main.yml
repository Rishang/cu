---
- name: Require exactly one PostgreSQL schema input
  ansible.builtin.assert:
    that:
      - >-
        (cloudutil_postgres_config_file is not none) !=
        (cloudutil_postgres_config is not none)
    fail_msg: >-
      Set exactly one of cloudutil_postgres_config_file or
      cloudutil_postgres_config.

- name: Validate, normalize, and render PostgreSQL schema file
  ansible.builtin.set_fact:
    cloudutil_postgres: >-
      {{ cloudutil_postgres_config_file
         | cloudutil_sql_config_file(cloudutil_postgres_environment) }}
  when: cloudutil_postgres_config_file is not none
  no_log: true

- name: Validate, normalize, and render inline PostgreSQL schema
  ansible.builtin.set_fact:
    cloudutil_postgres: >-
      {{ cloudutil_postgres_config
         | cloudutil_sql_config(cloudutil_postgres_environment) }}
  when: cloudutil_postgres_config is not none
  no_log: true

- name: Create requested databases
  community.postgresql.postgresql_db:
    name: "{{ item.value.name }}"
    owner: "{{ cloudutil_postgres.provider.username }}"
    state: present
    maintenance_db: postgres
    login_host: "{{ cloudutil_postgres.provider.host }}"
    login_port: "{{ cloudutil_postgres.provider.port }}"
    login_user: "{{ cloudutil_postgres.provider.username }}"
    login_password: "{{ cloudutil_postgres.provider.password }}"
    ssl_mode: "{{ cloudutil_postgres.provider.ssl_mode or ('verify-full' if cloudutil_postgres.provider.cert else ('require' if cloudutil_postgres.provider.mtls else 'prefer')) }}"
    ca_cert: "{{ cloudutil_postgres.provider.cert }}"
    ssl_cert: "{{ cloudutil_postgres.provider.mtls.cert if cloudutil_postgres.provider.mtls else omit }}"
    ssl_key: "{{ cloudutil_postgres.provider.mtls.key if cloudutil_postgres.provider.mtls else omit }}"
  loop: "{{ cloudutil_postgres.database | dict2items }}"
  when: item.value.create
  no_log: true

- name: Install or update PostgreSQL extensions
  community.postgresql.postgresql_ext:
    name: "{{ item.1.name }}"
    login_db: "{{ item.0.value.name }}"
    state: present
    version: latest
    login_host: "{{ cloudutil_postgres.provider.host }}"
    login_port: "{{ cloudutil_postgres.provider.port }}"
    login_user: "{{ cloudutil_postgres.provider.username }}"
    login_password: "{{ cloudutil_postgres.provider.password }}"
    ssl_mode: "{{ cloudutil_postgres.provider.ssl_mode or ('verify-full' if cloudutil_postgres.provider.cert else ('require' if cloudutil_postgres.provider.mtls else 'prefer')) }}"
    ca_cert: "{{ cloudutil_postgres.provider.cert }}"
    ssl_cert: "{{ cloudutil_postgres.provider.mtls.cert if cloudutil_postgres.provider.mtls else omit }}"
    ssl_key: "{{ cloudutil_postgres.provider.mtls.key if cloudutil_postgres.provider.mtls else omit }}"
  loop: "{{ cloudutil_postgres.database | dict2items | subelements('value.extensions', skip_missing=True) }}"
  no_log: true

- name: Create or update login roles
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    state: present
    login_db: postgres
    login_host: "{{ cloudutil_postgres.provider.host }}"
    login_port: "{{ cloudutil_postgres.provider.port }}"
    login_user: "{{ cloudutil_postgres.provider.username }}"
    login_password: "{{ cloudutil_postgres.provider.password }}"
    ssl_mode: "{{ cloudutil_postgres.provider.ssl_mode or ('verify-full' if cloudutil_postgres.provider.cert else ('require' if cloudutil_postgres.provider.mtls else 'prefer')) }}"
    ca_cert: "{{ cloudutil_postgres.provider.cert }}"
    ssl_cert: "{{ cloudutil_postgres.provider.mtls.cert if cloudutil_postgres.provider.mtls else omit }}"
    ssl_key: "{{ cloudutil_postgres.provider.mtls.key if cloudutil_postgres.provider.mtls else omit }}"
  loop: "{{ cloudutil_postgres.users }}"
  no_log: true

- name: Apply role privileges
  ansible.builtin.include_tasks: privileges.yml
  loop: "{{ cloudutil_postgres.users | subelements('privileges', skip_missing=True) }}"
  loop_control:
    loop_var: cloudutil_postgres_user_privilege
  vars:
    cloudutil_postgres_role: "{{ cloudutil_postgres_user_privilege.0 }}"
    cloudutil_postgres_privilege: "{{ cloudutil_postgres_user_privilege.1 }}"
  when: >-
    cloudutil_postgres_user_privilege.1.readwrite or
    cloudutil_postgres_user_privilege.1.readonly
  no_log: true

- name: Execute rendered custom SQL
  community.postgresql.postgresql_query:
    login_db: "{{ item.database }}"
    query: "{{ item.query_raw }}"
    positional_args: "{{ item.params or omit }}"
    login_host: "{{ cloudutil_postgres.provider.host }}"
    login_port: "{{ cloudutil_postgres.provider.port }}"
    login_user: "{{ cloudutil_postgres.provider.username }}"
    login_password: "{{ cloudutil_postgres.provider.password }}"
    ssl_mode: "{{ cloudutil_postgres.provider.ssl_mode or ('verify-full' if cloudutil_postgres.provider.cert else ('require' if cloudutil_postgres.provider.mtls else 'prefer')) }}"
    ca_cert: "{{ cloudutil_postgres.provider.cert }}"
    ssl_cert: "{{ cloudutil_postgres.provider.mtls.cert if cloudutil_postgres.provider.mtls else omit }}"
    ssl_key: "{{ cloudutil_postgres.provider.mtls.key if cloudutil_postgres.provider.mtls else omit }}"
  loop: "{{ cloudutil_postgres.custom_sql }}"
  changed_when: true
  no_log: true
