---
- name: "Case s1: basic database, app user, and custom SQL"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  roles:
    - role: cloudutil_postgres
      vars:
        cloudutil_postgres_config_file: "{{ playbook_dir }}/postgres.yml"
