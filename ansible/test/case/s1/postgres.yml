provider:
  name: postgres
  version: 18
  host: postgres
  port: 5432
  username: aws_internal_superuser
  password: hidden_root_password

database:
  - name: cloudutil_case_s1
    extensions:
      - name: pgcrypto

users:
  - name: cloudutil_s1_app
    password: app-password
    privileges:
      - db: cloudutil_case_s1
        readwrite: true
        tables: [ALL]
  - name: cloudutil_s1_reader
    password: reader-password
    privileges:
      - db: cloudutil_case_s1
        readonly: true
        tables: [ALL]

custom_sql:
  - name: create_table
    database: cloudutil_case_s1
    query: |
      CREATE TABLE IF NOT EXISTS public.s1_smoke (id integer PRIMARY KEY, value text NOT NULL);
  - name: seed_table
    database: cloudutil_case_s1
    query: |
      INSERT INTO public.s1_smoke (id, value)
      VALUES (%s, %s)
      ON CONFLICT (id) DO UPDATE SET value = EXCLUDED.value;
    params: [1, hello-from-s1]
