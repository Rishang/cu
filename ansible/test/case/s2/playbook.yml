---
- name: "Case s2: non-superuser mock-RDS master role, current/future grants"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  roles:
    - role: cloudutil_postgres
      vars:
        cloudutil_postgres_config_file: "{{ playbook_dir }}/postgres.yml"
        cloudutil_postgres_environment:
          CASE_S2_HOST: postgres
          CASE_S2_USER: rds_master_user
          CASE_S2_PASSWORD: my_secure_rds_password
          CASE_S2_WRITER_PASSWORD: writer-password
          CASE_S2_READER_PASSWORD: reader-password
